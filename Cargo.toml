[package]
name = "suiko-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Reproducible evaluation and calibration for suiko's Japanese writing diagnostics"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
jiff = { version = "0.2", default-features = false, features = ["std"] }
pdf-extract = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# 評価は未リリースの規則も対象にするため、隣に置いた suiko の作業ツリーを使う。
suiko = { path = "../suiko" }
thiserror = "2"
toml = "1.1"
ureq = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
